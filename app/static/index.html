<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Agent</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2e0;
          --wave:#8a94a6; --beat:rgba(40,90,200,.28); --down:#d2451e; --head:#111; --ok:#1d7a3a; --err:#b42318; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececf0; --muted:#9a9aa3;
          --line:#2c2c31; --wave:#6f7a90; --beat:rgba(120,160,255,.30); --down:#ff7a52; --head:#fff; } }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  header h1 { font-size:16px; margin:0 8px 0 0 }
  input[type=text] { padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); min-width:260px }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer }
  button:disabled { opacity:.4; cursor:default }
  main { display:grid; grid-template-columns: 1fr 380px; gap:16px; padding:16px }
  @media (max-width: 900px) { main { grid-template-columns: 1fr } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px }
  canvas { width:100%; height:180px; display:block; cursor:pointer }
  .facts { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); margin-top:8px; font-size:13px }
  .facts b { color:var(--ink); font-weight:600 }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px }
  #log { height:420px; overflow:auto; display:flex; flex-direction:column; gap:8px }
  .msg { padding:8px 10px; border-radius:8px; white-space:pre-wrap; font-size:13px }
  .user { background:rgba(40,90,200,.10); align-self:flex-end; max-width:85% }
  .agent { background:rgba(127,127,127,.08) }
  .agent.err { border-left:3px solid var(--err) } .agent.ok { border-left:3px solid var(--ok) } .agent.ask { border-left:3px solid var(--warn) }
  .tag { font-size:11px; color:var(--muted); display:block; margin-bottom:2px }
  #status { color:var(--muted); font-size:13px }
  ol#hist { margin:6px 0 0 18px; padding:0; color:var(--muted); font-size:12px }
  audio { width:100% }
</style>
</head>
<body>
<header>
  <h1>Beat Agent</h1>
  <input id="path" type="text" placeholder="path to WAV / MP3 / FLAC (relative to repo)">
  <button id="openBtn">Open</button>
  <input id="up" type="file" accept=".wav,.mp3,.flac,audio/*">
  <span id="status">Load a track to begin.</span>
</header>
<main>
  <section>
    <div class="card">
      <canvas id="wave" width="1600" height="360"></canvas>
      <div class="facts" id="facts"></div>
      <div class="row">
        <audio id="player" controls></audio>
      </div>
      <div class="row">
        <label><input type="checkbox" id="click"> click audition (accent = downbeat)</label>
        <button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button>
        <button id="export" disabled>Export audio + grid</button>
        <span id="exported" style="color:var(--muted);font-size:12px"></span>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <b>Edit history</b> <span style="color:var(--muted);font-size:12px">(each line = one chat turn)</span>
      <ol id="hist"></ol>
    </div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:8px">
    <b>Chat</b>
    <div id="log"></div>
    <form id="chat" class="row" style="margin:0">
      <input id="msg" type="text" style="flex:1;min-width:0" placeholder="e.g. cut beat 16-32 and repeat it twice" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </section>
</main>
<script>
let S = null;
const $ = id => document.getElementById(id);
const player = $("player");

function setStatus(t) { $("status").textContent = t; }

function draw() {
  const c = $("wave"), ctx = c.getContext("2d");
  const W = c.width, H = c.height, css = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, W, H);
  if (!S) return;
  const dur = S.duration, x = t => t / dur * W;
  // beats
  S.beats.forEach((t, i) => {
    const down = S.positions[i] === 1;
    ctx.strokeStyle = down ? css.getPropertyValue("--down") : css.getPropertyValue("--beat");
    ctx.lineWidth = down ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(x(t), down ? 0 : 24); ctx.lineTo(x(t), H); ctx.stroke();
  });
  // bar labels, thinned to fit
  const bars = []; let bar = 0;
  S.positions.forEach((p, i) => { if (p === 1) { bar++; bars.push([bar, S.beats[i]]); } });
  const every = Math.max(1, Math.ceil(bars.length / (W / 60)));
  ctx.fillStyle = css.getPropertyValue("--down"); ctx.font = "20px system-ui";
  bars.forEach(([b, t]) => { if ((b - 1) % every === 0) ctx.fillText(b, x(t) + 3, 20); });
  // waveform
  ctx.fillStyle = css.getPropertyValue("--wave");
  const n = S.peaks.length, mid = H / 2 + 12, amp = (H - 30) / 2;
  S.peaks.forEach(([lo, hi], i) => {
    const px = i / n * W;
    ctx.fillRect(px, mid - hi * amp, Math.max(1, W / n), Math.max(1, (hi - lo) * amp));
  });
  // playhead
  ctx.strokeStyle = css.getPropertyValue("--head"); ctx.lineWidth = 2;
  const ph = x(player.currentTime || 0);
  ctx.beginPath(); ctx.moveTo(ph, 0); ctx.lineTo(ph, H); ctx.stroke();
}

function render(state) {
  S = state;
  const m = S.summary, conf = S.confidence || {};
  $("facts").innerHTML = [
    ["file", S.file], ["version", S.version], ["tempo", m.tempo_bpm + " BPM"], ["meter", m.time_signature],
    ["grid", m.grid_type], ["beats", m.n_beats], ["bars", m.n_bars], ["length", m.duration_s + " s"],
    ["confidence", conf.overall ?? "-"], ["tracker", (S.meta || {}).tracker || "-"],
    ["interpreter", S.interpreter], ["format", S.sr + " Hz " + S.subtype],
  ].map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("") +
    (m.tempo_segments && m.tempo_segments.length > 1 ? `<span>tempo segments <b>${m.tempo_segments.map(s => `bar ${s.start_bar}: ${s.bpm}`).join(" → ")}</b></span>` : "");
  $("hist").innerHTML = S.history.map(h => `<li>${h}</li>`).join("");
  $("undo").disabled = !S.can_undo; $("redo").disabled = !S.can_redo;
  ["msg", "send", "export"].forEach(id => $(id).disabled = false);
  loadAudio();
  draw();
}

function loadAudio() {
  const t = player.currentTime || 0, playing = !player.paused;
  player.src = `/api/${S.sid}/audio/${S.state_id}.wav?click=${$("click").checked ? 1 : 0}`;
  player.addEventListener("loadedmetadata", () => { player.currentTime = Math.min(t, player.duration || 0); if (playing) player.play(); }, { once: true });
}

function addMsg(text, cls, tag) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = (tag ? `<span class="tag">${tag}</span>` : "");
  d.appendChild(document.createTextNode(text));
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}

async function api(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function open(fn, label) {
  setStatus(`Analysing ${label}… (beat tracking runs on CPU; a 6-minute track takes a while)`);
  try {
    const st = await fn();
    setStatus(`Analysed ${st.file} in ${st.analysis_s} s.`);
    $("log").innerHTML = "";
    addMsg(`Loaded ${st.file}: ${st.summary.tempo_bpm} BPM, ${st.summary.time_signature}, ${st.summary.n_bars} bars, ${st.summary.grid_type} grid. ` +
           `Beats are 0-based grid lines (ranges [start, end)); bars are 1-based and inclusive.`, "agent", "agent");
    render(st);
  } catch (e) { setStatus("Error: " + e.message); }
}

$("openBtn").onclick = () => open(() => api("/api/open", { path: $("path").value }), $("path").value);
$("up").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  open(async () => { const r = await fetch("/api/upload", { method: "POST", body: fd }); const j = await r.json(); if (!r.ok) throw new Error(j.detail); return j; }, f.name);
};
$("chat").onsubmit = async e => {
  e.preventDefault();
  const text = $("msg").value.trim(); if (!text || !S) return;
  $("msg").value = ""; addMsg(text, "user");
  $("send").disabled = true; setStatus("Thinking…");
  try {
    const r = await api(`/api/${S.sid}/chat`, { text });
    const rep = r.reply;
    const cls = !rep.ok ? "err" : rep.action === "clarify" ? "ask" : rep.changed ? "ok" : "";
    let t = rep.text;
    if (rep.interpretation) t += `\nReading: ${rep.interpretation}`;
    addMsg(t, "agent " + cls, `${rep.action} · ${rep.backend}`);
    render(r.state); setStatus("");
  } catch (e) { addMsg("Error: " + e.message, "agent err"); setStatus(""); }
  $("send").disabled = false;
};
$("undo").onclick = async () => { const r = await api(`/api/${S.sid}/undo`); addMsg(r.reply.text, "agent ok", "undo"); render(r.state); };
$("redo").onclick = async () => { const r = await api(`/api/${S.sid}/redo`); addMsg(r.reply.text, "agent ok", "redo"); render(r.state); };
$("export").onclick = async () => {
  const r = await api(`/api/${S.sid}/export`);
  $("exported").innerHTML = ["audio", "grid", "click", "edl"].map(k => `<a href="/api/${S.sid}/file?path=${encodeURIComponent(r[k])}">${k}</a>`).join(" · ") +
    (r.clipped_samples ? ` <span style="color:var(--err)">⚠ ${r.clipped_samples} clipped samples</span>` : "");
};
$("click").onchange = () => S && loadAudio();
$("wave").onclick = e => { if (!S) return; const r = e.target.getBoundingClientRect(); player.currentTime = (e.clientX - r.left) / r.width * S.duration; };
(function tick() { if (S && !player.paused) draw(); requestAnimationFrame(tick); })();
</script>
</body>
</html>
